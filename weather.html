<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather - AgroSense</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="assets/leaf.png">
  <style>
    /* Page-specific button colors */
    .fetch-btn {
      background: linear-gradient(90deg, #3b82f6, #06b6d4);
      border: none;
      color: #0c1116;
      padding: 10px 16px;
      border-radius: 10px;
    }
    .fetch-btn:hover {
      filter: brightness(1.05);
      transform: translateY(-2px);
    }
    
    .location-btn {
      background: linear-gradient(90deg, #10b981, #22c55e);
      border: none;
      color: #0c1116;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 10px;
      width: 100%;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .location-btn:hover {
      filter: brightness(1.05);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }
    
    /* Location search container */
    .location-search-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
    }
    
    .search-bar {
      display: flex;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 4px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      transition: all 0.2s ease;
    }
    
    .search-bar:focus-within {
      border-color: #3b82f6;
      box-shadow: 0 2px 12px rgba(59, 130, 246, 0.2);
    }
    
    .search-icon {
      margin-left: 12px;
      color: var(--muted);
    }
    
    .search-input {
      flex: 1;
      padding: 12px;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }
    
    .location-options {
      display: flex;
      gap: 8px;
    }
    
    .search-results {
      max-height: 200px;
      overflow-y: auto;
      border-radius: 10px;
      background: var(--panel);
      border: 1px solid var(--border);
      margin-top: 8px;
      display: none;
    }
    
    .search-result-item {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .search-result-item:last-child {
      border-bottom: none;
    }
    
    .search-result-item:hover {
      background: rgba(255, 255, 255, 0.05);
    }
    
    .search-result-icon {
      color: var(--accent);
    }
    
    .search-result-name {
      font-weight: 500;
    }
    
    .search-result-details {
      color: var(--muted);
      font-size: 0.85rem;
    }
    
    .location-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    
    .location-icon {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html"><img src="assets/logo.svg" alt="AgroSense"/><span>AgroSense</span></a>
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="weather.html" class="active">Weather</a>
      <a href="chatbot2.html">AI Assistant</a>
      <a href="prediction.html">Prediction</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
    <button id="themeToggle" aria-label="Toggle theme">🌙</button>
  </header>

  <main style="max-width:1100px;margin:0 auto;padding:18px;">
    <h1>Weather & Forecast</h1>
    <p class="muted">Your current location is tracked and shown first. Search other cities to add below.</p>

    <section class="features" style="grid-template-columns:1fr 2fr;align-items:start;">
      <article>
        <h3>Location</h3>
        <div class="location-search-container">
          <div class="search-bar">
            <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input id="city" placeholder="Search city or location..." class="search-input">
            <button class="btn fetch-btn" id="fetchCity">Fetch</button>
          </div>
          <div class="location-options">
            <button class="btn location-btn" id="useGeo">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                <path d="M2 12h20"></path>
              </svg>
              Use GPS Location
            </button>
          </div>
        </div>
        <div id="search-results" class="search-results"></div>
      </article>
      <article>
        <h3 id="currentTitle">Current Location</h3>
        <div id="currentForecast" style="display:grid;grid-template-columns:1fr;gap:10px"></div>
      </article>
    </section>

    <section class="features" style="grid-template-columns:1fr;align-items:start;margin-top:14px">
      <article>
        <h3 id="otherTitle" style="display:none"></h3>
        <div id="forecast" style="display:grid;grid-template-columns:1fr;gap:10px"></div>
      </article>
    </section>
  </main>

  <footer class="site-footer"><p>© <span id="year"></span> AgroSense.</p></footer>

  <script src="scripts/theme.js"></script>
  <script src="scripts/auth.js"></script>
  <script src="scripts/weather.js"></script>
  <script>
    if(window.Auth && !window.Auth.requireAuth()){};
    document.querySelectorAll('.features article').forEach((el,i)=>{ el.classList.add('fade-in'); el.style.animationDelay=(i*120)+'ms'; });
  </script>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
